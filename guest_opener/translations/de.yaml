configuration:
  property_name:
    name: Name der Unterkunft
    description: Erscheint als Überschrift auf der Gäste- und Admin-Seite.
  public_url:
    name: Öffentliche Adresse
    description: z. B. https://tuer.example.de – wird in die Gäste-Links eingesetzt. Leer = Adresse, über die die Admin-Seite aufgerufen wurde.
  timezone:
    name: Zeitzone
    description: Für An- und Abreisezeiten, z. B. Europe/Berlin.
  property_lat:
    name: Breitengrad der Wohnung
    description: z. B. 47.12345 (in Google Maps Rechtsklick auf das Haus).
  property_lon:
    name: Längengrad der Wohnung
    description: z. B. 11.12345
  geofence_radius_m:
    name: Radius der Standortprüfung (m)
    description: Gäste müssen so nah am Haus sein, um eine Tür zu öffnen. 0 schaltet die Prüfung ab.
  host_phone:
    name: Telefonnummer für Notfälle
    description: Wird den Gästen als „Probleme? Ruf uns an“ angezeigt.
  admin_password:
    name: Admin-Passwort
    description: Für /admin, mindestens 12 Zeichen. Eine Änderung meldet alle Admin-Sitzungen ab.
  door_house:
    name: Haustür – Entität
    description: „off“ blendet die Tür aus. „mock“ simuliert sie. Sonst lock.*, switch.*, button.* oder script.*, z. B. switch.haustuer.
  door_house_name:
    name: Haustür – Bezeichnung
    description: Steht auf den Knöpfen und in der Gästenachricht. Leer = Haustür.
  door_house_mode:
    name: Haustür – Betriebsart
    description: open = nur öffnen. open_and_lock = Falle ziehen und zusperren. unlock_and_lock = aufsperren und zusperren. Die letzten beiden nur bei lock.* oder mock.
  door_house_battery:
    name: Haustür – Batterie-Sensor
    description: Optional, sensor.* in Prozent oder binary_sensor.* (an = schwach).
  door_apartment:
    name: Wohnungstür – Entität
    description: „off“ blendet die Tür aus. „mock“ simuliert sie. Sonst lock.*, switch.*, button.* oder script.*, z. B. lock.wohnungstuer.
  door_apartment_name:
    name: Wohnungstür – Bezeichnung
    description: Steht auf den Knöpfen und in der Gästenachricht. Leer = Wohnungstür.
  door_apartment_mode:
    name: Wohnungstür – Betriebsart
    description: open = nur öffnen. open_and_lock = Falle ziehen und zusperren. unlock_and_lock = aufsperren und zusperren. Die letzten beiden nur bei lock.* oder mock.
  door_apartment_battery:
    name: Wohnungstür – Batterie-Sensor
    description: Optional, sensor.* in Prozent oder binary_sensor.* (an = schwach).
  notify_service:
    name: Benachrichtigungen
    description: Optional, z. B. notify.mobile_app_dein_handy. Meldet Ankunft von Gästen, Öffnungsversuche aus der Ferne, gesperrte PINs/Logins und Türfehler.
network:
  8787/tcp: Nur zum Testen im Heimnetz. Für Gäste läuft der Zugriff über den Reverse Proxy (Port 443).
